pal_wbc_controller:
  task_description:
    joint_limits:
      type: "pal_wbc/JointPosVelAccLimitsDynamicTask"
      weight: 1.0
      priority: 0
      start: true
      damping: 0.0
      joint_names: ["arm_1_joint", "arm_2_joint", "arm_3_joint", "arm_4_joint", "arm_5_joint", "arm_6_joint", "arm_7_joint", "torso_lift_joint"]
      upper_bound_position: []
      lower_bound_position: []
      upper_bound_velocity: []
      lower_bound_velocity: []
      acceleration_limits: []
      velocity_clamp: true
      position_enable_recovery: false
      velocity_enable_recovery: false
      position_time_parameter: 0.03
      velocity_time_parameter: 0.005
    dynamics:
      type: "pal_wbc/PhysicsConstraintTask"
      weight: 1.0
      priority: 0
      start: true
      damping: 0.0
      mu: 0.3
